<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamPlatform</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="app-header">
      <button id="app-back" class="app-back-button hidden" type="button">Back</button>
      <a id="app-home" class="logo" href="#" aria-label="ExamPlatform home">
        <span class="logo-mark">E</span>
        <span class="logo-copy">
          <strong>ExamPlatform</strong>
          <span>Competitive Exams</span>
        </span>
      </a>
      <div id="app-screen-title" class="app-screen-title" aria-live="polite"></div>
      <button id="app-account" class="profile-box hidden" type="button"></button>
    </header>
    <main class="main-content" id="main-content"></main>
  </div>
  <script src="app.js"></script>
</body>
</html>
